name: Release candidate

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - run: corepack enable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.9.0
          cache: pnpm
      - run: corepack pnpm install --frozen-lockfile
      - run: |
          mkdir -p .artifacts/release-checks
          corepack pnpm verify 2>&1 | tee .artifacts/release-checks/verify.log
      - run: node scripts/ci/release-artifact.mjs --require-supported
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        if: always()
        with:
          name: release-candidate-package
          path: |
            .artifacts/release
            .artifacts/release-checks
          if-no-files-found: warn
          retention-days: 30

  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - run: corepack enable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.9.0
          cache: pnpm
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: 3.12.12
      - run: corepack pnpm install --frozen-lockfile
      - run: scripts/ci/install-security-tools.sh
      - run: |
          python3 -m venv .ci-tools/venv
          .ci-tools/venv/bin/pip install --disable-pip-version-check semgrep==1.183.0
      - run: scripts/ci/security-scan.sh
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        if: always()
        with:
          name: release-candidate-security
          path: .artifacts/security
          if-no-files-found: error
          retention-days: 30

  clean-install:
    needs: [package, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - run: corepack enable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.9.0
          cache: pnpm
      - uses: oven-sh/setup-bun@b7a1c7ccf290d58743029c4f6903da283811b979 # v2.1.0
        with:
          bun-version: 1.4.4
      - run: corepack pnpm install --frozen-lockfile
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: release-candidate-package
          path: .artifacts/download
      - run: |
          cd .artifacts/download/release
          sha256sum --check SHA256SUMS
      - run: |
          tarball="$(node -p "require('./package.json').name + '-' + require('./package.json').version + '.tgz'")"
          node scripts/ci/verify-host-install.mjs ".artifacts/download/release/$tarball" .artifacts/release-install
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        if: always()
        with:
          name: release-candidate-clean-install
          path: .artifacts/release-install
          if-no-files-found: error
          retention-days: 30
