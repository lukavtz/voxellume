name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adversarial:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - run: corepack enable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.9.0
          cache: pnpm
      - run: corepack pnpm install --frozen-lockfile
      - run: |
          mkdir -p .artifacts/security-${{ matrix.os }}
          corepack pnpm test:security 2>&1 | tee .artifacts/security-${{ matrix.os }}/adversarial.log
        shell: bash
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        if: always()
        with:
          name: security-adversarial-${{ matrix.os }}
          path: .artifacts/security-${{ matrix.os }}
          if-no-files-found: error
          retention-days: 30

  supply-chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - run: corepack enable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.9.0
          cache: pnpm
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: 3.12.12
      - run: corepack pnpm install --frozen-lockfile
      - run: scripts/ci/install-security-tools.sh
      - run: |
          python3 -m venv .ci-tools/venv
          .ci-tools/venv/bin/pip install --disable-pip-version-check semgrep==1.183.0
      - run: scripts/ci/security-scan.sh
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        if: always()
        with:
          name: security-supply-chain
          path: .artifacts/security
          if-no-files-found: error
          retention-days: 30
