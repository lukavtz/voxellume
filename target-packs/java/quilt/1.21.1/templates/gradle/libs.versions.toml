# The latest versions are available at https://quiltmc.org/en/usage/latest-versions/
[versions]
minecraft = "1.21.1"
quilt_mappings = "1.21.1+build.9"

quilt_loom = "1.15.1"
quilt_loader = "0.30.2"

quilt_standard_libraries = "10.0.0-alpha.5+1.21.1"

[libraries]
minecraft = { module = "com.mojang:minecraft", version.ref = "minecraft" }
quilt_mappings = { module = "org.quiltmc:quilt-mappings", version.ref = "quilt_mappings" }
quilt_loader = { module = "org.quiltmc:quilt-loader", version.ref = "quilt_loader" }

quilt_standard_libraries = { module = "org.quiltmc:qsl", version.ref = "quilt_standard_libraries" }

[plugins]
quilt_loom = { id = "org.quiltmc.loom.remap", version.ref = "quilt_loom" }
